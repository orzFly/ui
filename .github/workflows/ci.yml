name: CI

on:
  pull_request:
  # publish.yml runs this as its first job on every master push and release tag, so a push is
  # checked once and nothing is published unless the checks pass.
  workflow_call:
    inputs:
      pages:
        description: Upload the Storybook site as the Pages artifact once every check has passed.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Matches the devshell in .nix/flake.nix.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # Storybook writes only relative URLs, so the site `pnpm build` made serves from the /ui/
      # project-site path with no base set.
      - if: inputs.pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/storybook/storybook-static
